name: build-native-windows
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native C++ executable
        shell: cmd
        run: build_windows.bat
      - name: Smoke test native executable (CPU provider)
        shell: pwsh
        run: tests/smoke_native.ps1
      - name: Upload native distribution
        uses: actions/upload-artifact@v4
        with:
          name: DiffSampler-native-windows-x64
          path: build/dist/**
